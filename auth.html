<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Spectrum Health Co</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Widget in HEAD to ensure it's ready -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Ensure our content sits below the Netlify Widget (z-index 99) */
        .content-layer { position: relative; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center">

    <div class="content-layer text-center p-8 bg-white rounded-xl shadow-lg max-w-md mx-4">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Account Setup</h1>
            <p class="text-gray-600 mt-2">Please complete the form in the popup window.</p>
        </div>

        <div id="status-message" class="text-sm text-teal-600 font-medium mb-6">
            Initializing secure connection...
        </div>

        <!-- Fallback button: High Z-Index to ensure it's clickable if overlay gets stuck -->
        <button id="manual-btn" onclick="openWidget()" class="hidden w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500">
            Open Login / Signup Window
        </button>
        
        <p class="mt-4 text-xs text-gray-400">
            If the window doesn't appear, please click the button above.
        </p>
    </div>

    <script>
        const statusMsg = document.getElementById('status-message');
        const manualBtn = document.getElementById('manual-btn');

        function openWidget() {
            netlifyIdentity.open();
        }

        // 1. Initialize Widget
        // It automatically scans the URL for #invite_token or #recovery_token
        netlifyIdentity.init();

        // 2. Handle Login (Success)
        netlifyIdentity.on('login', user => {
            statusMsg.textContent = "Success! Redirecting to dashboard...";
            statusMsg.className = "text-sm text-green-600 font-bold mb-6";
            // Redirect to main dashboard
            setTimeout(() => {
                window.location.href = "/"; 
            }, 1500);
        });

        // 3. Handle Errors
        netlifyIdentity.on('error', err => {
            console.error('Auth Error', err);
            statusMsg.textContent = "An error occurred. Please try again.";
            statusMsg.className = "text-sm text-red-600 font-medium mb-6";
            manualBtn.classList.remove('hidden');
        });

        // 4. Safety Timeout
        // If the widget doesn't auto-open within 1 second, show the manual button
        setTimeout(() => {
            manualBtn.classList.remove('hidden');
            statusMsg.textContent = "Ready.";
        }, 1000);
    </script>
</body>
</html>
